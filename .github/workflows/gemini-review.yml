name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ 获取改动文件
      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v41

      # 3️⃣ 生成完整 diff
      - name: Generate full diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          FILES="${{ steps.changed.outputs.all_changed_files }}"
          git diff origin/${{ github.base_ref }} HEAD -- $FILES > diff.txt
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 4️⃣ 运行 Gemini CLI
      - name: Run Gemini CLI review
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0.1.15
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-flash
          prompt: |
            You are a senior software engineer performing a pull request review.

            Review STRICTLY based on the provided git diff.

            Your response should include:
            - **Severity classification** (Bug risk / Optimization / Readability issue / Security concern)
            - Suggestions for improvement
            - Example fixes if possible
            - Short summary conclusion

            Do not repeat unchanged code.

            #### Pull Request Diff:
            ${{ steps.diff.outputs.diff }}
      
      # 5️⃣ 在 PR 上发表评论（带错误处理）
      - name: Comment on PR with review result
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🤖 **Gemini AI 代码审查结果：**

            ${{ steps.gemini.outputs.summary }}

            ${{ steps.gemini.outputs.error && format('**错误信息:** {0}', steps.gemini.outputs.error) || '' }}
